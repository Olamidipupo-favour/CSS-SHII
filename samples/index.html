  </div>

  <script>
    // Auto-focus hovered card to prevent cutoff
    const carousel = document.querySelector('.marquee-wrapper');
    const cards = document.querySelectorAll('.card');
    
    cards.forEach(card => {
      card.addEventListener('mouseenter', function() {
        const cardRect = this.getBoundingClientRect();
        const carouselRect = carousel.getBoundingClientRect();
        
        // Calculate if card is being cut off
        const cardCenter = cardRect.left + cardRect.width / 2;
        const carouselCenter = carouselRect.left + carouselRect.width / 2;
        const offset = cardCenter - carouselCenter;
        
        // Smoothly scroll to center the card
        if (Math.abs(offset) > 50) {
          carousel.scrollBy({
            left: offset,
            behavior: 'smooth'
          });
        }
      });
    });
  </script>
